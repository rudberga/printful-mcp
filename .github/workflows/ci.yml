name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version package.json claims to support, the current LTS,
        # and the newest line — so an engines claim can't quietly go stale.
        node: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The published tarball should never carry source, tests or a token.
      # Guard that here rather than noticing it after a release.
      - name: Verify package contents
        if: matrix.node == '22.x'
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path).sort();
            console.log('Tarball contents:', files);
            const expected = ['LICENSE','README.md','dist/client.js','dist/index.js','dist/redact.js','package.json'];
            const unexpected = files.filter(f => !expected.includes(f));
            if (unexpected.length) { console.error('Unexpected files in tarball:', unexpected); process.exit(1); }
            for (const f of expected) {
              if (!files.includes(f)) { console.error('Missing from tarball:', f); process.exit(1); }
            }
          "
